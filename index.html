<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jukebox Brasil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
    <style>
        :root { --azul: #00f0ff; --vermelho: #ff0055; --fundo: #0a0a0f; --card: #12121a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: var(--fundo); color: #ffffff; padding: 20px; max-width: 500px; margin: 0 auto; }
        header { text-align: center; padding: 30px 0; }
        h1 { font-size: 1.8rem; text-transform: uppercase; text-shadow: 0 0 10px var(--azul); margin-bottom: 10px; }
        .subtitle { color: #aaa; font-size: 1rem; }
        .jukebox { background-color: var(--card); border: 2px solid #333; border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 30px; }
        .tela { background-color: #050508; border: 1px solid var(--azul); border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .status { color: var(--azul); font-weight: bold; }
        .botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { background-color: #151522; border: 1px solid #333; color: #fff; padding: 15px; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        .btn:hover { border-color: var(--vermelho); }
        .beneficios { display: grid; gap: 15px; margin-bottom: 30px; }
        .beneficio { background-color: var(--card); padding: 20px; border-radius: 10px; border-left: 3px solid var(--azul); }
        .beneficio h3 { margin-bottom: 8px; font-size: 1.1rem; }
        .beneficio p { color: #888; font-size: 0.9rem; }
        .whatsapp { display: block; background: linear-gradient(90deg, #25D366, #128C7E); color: white; text-align: center; padding: 15px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 1.1rem; }
        footer { text-align: center; padding: 30px; color: #555; font-size: 0.8rem; margin-top: 20px; }
    </style>
</head>
<body>
    <audio id="player">

    <header>
        <h1>Jukebox Brasil</h1>
        <p class="subtitle">Música • Pix • Automatizada</p>
    </header>

    <div class="jukebox">
        <div class="tela">
            <p class="status" id="status"><i class="fa-solid fa-compact-disc fa-spin"></i> Escolha um gênero</p>
        </div>
        <div class="botoes">
            <button class="btn" onclick="tocar('Forró', 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c7c084b6.mp3')">🤠 FORRÓ</button>
            <button class="btn" onclick="tocar('Sertanejo', 'https://cdn.pixabay.com/download/audio/2022/01/18/audio_9115b750b0.mp3')">🎸 SERTANEJO</button>
            <button class="btn" onclick="tocar('Rock', 'https://cdn.pixabay.com/download/audio/2022/05/27/audio_7074b59796.mp3')">⚡ ROCK</button>
            <button class="btn" onclick="tocar('Sucessos', 'https://cdn.pixabay.com/download/audio/2022/03/24/audio_9003b76d9d.mp3')">🔥 TOP HITS</button>
        </div>
    </div>

    <div class="beneficios">
        <div class="beneficio">
            <h3><i class="fa-solid fa-dollar-sign" style="color:#00f0ff"></i> Sem Custo</h3>
            <p>Instalação grátis — parceria 50/50</p>
        </div>
        <div class="beneficio">
            <h3><i class="fa-solid fa-qrcode" style="color:#ff0055"></i> Pagamento via Pix</h3>
            <p>Escaneou, pagou, tocou!</p>
        </div>
        <div class="beneficio">
            <h3><i class="fa-solid fa-location-dot" style="color:#00f0ff"></i> CE • RN • PB</h3>
            <p>Atendemos todo o Nordeste</p>
        </div>
    </div>

    <a href="https://wa.me/5588999543880" class="whatsapp" target="_blank">
        <i class="fa-brands fa-whatsapp"></i> Falar Conosco
    </a>

    <footer>
        &copy; 2026 Jukebox Brasil
    </footer>

    <script>
        function tocar(nome, url) {
            const status = document.getElementById('status');
            const player = document.getElementById('player');
            
            status.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="color:#ff0055"></i> Carregando ' + nome + '...';
            
            player.pause();
            player.src = url;
            player.play()
                .then(() => {
                    status.innerHTML = '<i class="fa-solid fa-volume-high fa-beat" style="color:#25D366"></i> Tocando ' + nome + '!';
                })
                .catch(() => {
                    status.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Clique novamente';
                });
        }
    </script>
</body>
</html>
