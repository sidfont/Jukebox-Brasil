<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jukebox Brasil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #0a0a0f;
            color: #fff;
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #00f0ff;
        }
        .jukebox {
            background: #12121a;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            margin-bottom: 30px;
        }
        .status {
            color: #00f0ff;
            padding: 15px;
            background: #050508;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .botoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        button {
            background: #1a1a2e;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #252540;
        }
        .beneficio {
            background: #12121a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .whatsapp {
            display: block;
            background: #25D366;
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>🎵 Jukebox Brasil</h1>

    <div class="jukebox">
        <div class="status" id="status">
            <i class="fa-solid fa-compact-disc"></i> Clique 2x para tocar
        </div>
        <div class="botoes">
            <button onclick="tocar('Forró', 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c7c084b6.mp3')">🤠 FORRÓ</button>
            <button onclick="tocar('Sertanejo', 'https://cdn.pixabay.com/download/audio/2022/01/18/audio_9115b750b0.mp3')">🎸 SERTANEJO</button>
            <button onclick="tocar('Rock', 'https://cdn.pixabay.com/download/audio/2022/05/27/audio_7074b59796.mp3')">⚡ ROCK</button>
            <button onclick="tocar('Sucessos', 'https://cdn.pixabay.com/download/audio/2022/03/24/audio_9003b76d9d.mp3')">🔥 TOP HITS</button>
        </div>
    </div>

    <div class="beneficio">
        <strong>💰 Sem custo de instalação</strong>
        <p>Colocamos de graça no seu estabelecimento</p>
    </div>
    <div class="beneficio">
        <strong>📲 Pagamento via Pix</strong>
        <p>Escaneou, pagou, tocou na hora!</p>
    </div>
    <div class="beneficio">
        <strong>🤝 50% para você</strong>
        <p>Dividimos o faturamento meio a meio</p>
    </div>
    <div class="beneficio">
        <strong>📍 CE • RN • PB</strong>
        <p>Atendemos todo o Nordeste</p>
    </div>

    <a href="https://wa.me/5588999543880" class="whatsapp" target="_blank">
        <i class="fa-brands fa-whatsapp"></i> Falar Conosco
    </a>

    <audio id="player">

    <script>
        const player = document.getElementById('player');
        let primeiroClique = true;

        function tocar(nome, url) {
            const status = document.getElementById('status');
            
            if (primeiroClique) {
                primeiroClique = false;
                status.innerHTML = '✅ Pronto! Agora clique NOVAMENTE para tocar ' + nome + '!';
                return;
            }
            
            status.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Carregando ' + nome + '...';
            player.pause();
            player.src = url;
            player.play()
                .then(() => {
                    status.innerHTML = '🎵 Tocando ' + nome + '! Aproveite!';
                })
                .catch(() => {
                    status.innerHTML = '❌ Clique novamente no botão';
                });
        }
    </script>

</body>
</html>
